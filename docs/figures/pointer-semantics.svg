<svg viewBox="0 0 680 432" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>状态迁移不是新文本：文本堆叠与指针迁移的对照</title>
  <desc>现状每次变化新增一行长文本并串成 supersedes 链，提议改为一个稳定槽位持有指针加迁移记录</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="50" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">状态迁移不是新文本：文本堆叠 vs 指针迁移</text>

  <rect x="40" y="72" width="290" height="214" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="56" y="94" font-size="13" font-weight="500" fill="#2C2C2A" font-family="sans-serif">现状：变化 = 新增一行文本</text>
  <rect x="56" y="106" width="258" height="34" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="70" y="127" font-size="11" fill="#5F5E5A" font-family="sans-serif">#3　戒备 · 因被撞见翻查卷宗</text>
  <text x="306" y="127" text-anchor="end" font-size="11" fill="#888780" font-family="sans-serif">已覆盖</text>
  <path d="M185 140 L185 152" stroke="#888780" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
  <text x="192" y="149" font-size="11" fill="#888780" font-family="sans-serif">supersedes</text>
  <rect x="56" y="152" width="258" height="34" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="70" y="173" font-size="11" fill="#5F5E5A" font-family="sans-serif">#6　放松 · 愿意交谈</text>
  <text x="306" y="173" text-anchor="end" font-size="11" fill="#888780" font-family="sans-serif">已覆盖</text>
  <path d="M185 186 L185 198" stroke="#888780" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
  <text x="192" y="195" font-size="11" fill="#888780" font-family="sans-serif">supersedes</text>
  <rect x="56" y="198" width="258" height="34" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="70" y="219" font-size="11" fill="#0C447C" font-family="sans-serif">#9　信任 · 主动交出卷宗</text>
  <text x="306" y="219" text-anchor="end" font-size="11" fill="#185FA5" font-family="sans-serif">当前</text>
  <text x="56" y="256" font-size="11" fill="#5F5E5A" font-family="sans-serif">每次变化复制一份长文本，链即历史</text>
  <text x="56" y="274" font-size="11" fill="#5F5E5A" font-family="sans-serif">只能靠相似度猜“这两条是不是同一个槽”</text>

  <rect x="360" y="72" width="280" height="214" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="376" y="94" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">提议：变化 = 挪动指针</text>
  <rect x="376" y="106" width="248" height="32" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="390" y="126" font-size="12" font-weight="500" fill="#0C447C" font-family="sans-serif" dominant-baseline="central">槽位　艾拉 → 主角 · 态度</text>
  <text x="376" y="154" font-size="11" fill="#5F5E5A" font-family="sans-serif">指针</text>
  <path d="M404 150 L424 150" stroke="#185FA5" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <rect x="430" y="140" width="104" height="24" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.5"/>
  <text x="482" y="152" text-anchor="middle" font-size="11" font-weight="500" fill="#0C447C" font-family="sans-serif" dominant-baseline="central">「信任」</text>
  <text x="542" y="152" font-size="11" fill="#5F5E5A" font-family="sans-serif" dominant-baseline="central">当前取值</text>
  <rect x="376" y="174" width="248" height="24" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="390" y="186" font-size="11" fill="#2C2C2A" font-family="sans-serif" dominant-baseline="central">#3　建槽：戒备</text>
  <rect x="376" y="202" width="248" height="24" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="390" y="214" font-size="11" fill="#2C2C2A" font-family="sans-serif" dominant-baseline="central">#6　迁移：戒备 → 放松</text>
  <rect x="376" y="230" width="248" height="24" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="390" y="242" font-size="11" fill="#2C2C2A" font-family="sans-serif" dominant-baseline="central">#9　迁移：放松 → 信任</text>
  <text x="376" y="272" font-size="11" fill="#5F5E5A" font-family="sans-serif">长文本只在建槽时写一次，迁移只记短标签</text>

  <rect x="40" y="300" width="600" height="112" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="56" y="322" font-size="13" font-weight="500" fill="#04342C" font-family="sans-serif">三种都是结构操作，不是新文本</text>
  <rect x="56" y="332" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="0.5"/>
  <text x="146" y="347" text-anchor="middle" font-size="11" fill="#2C2C2A" font-family="sans-serif" dominant-baseline="central">建立　∅ → A　长文本写一次</text>
  <rect x="250" y="332" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="0.5"/>
  <text x="340" y="347" text-anchor="middle" font-size="11" fill="#2C2C2A" font-family="sans-serif" dominant-baseline="central">迁移　A → B　只挪指针</text>
  <rect x="444" y="332" width="180" height="32" rx="8" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="0.5"/>
  <text x="534" y="347" text-anchor="middle" font-size="11" fill="#2C2C2A" font-family="sans-serif" dominant-baseline="central">撤销　A → ∅　指针置空</text>
  <text x="56" y="382" font-size="11" fill="#0F6E56" font-family="sans-serif">同一套指针语义：对齐 pending→realized ｜ 极性翻转 ¬P→P ｜ 立场演化 ｜ 属性更新</text>
  <text x="56" y="400" font-size="11" fill="#0F6E56" font-family="sans-serif">副产物：supersedeSimilarity 阈值可退休 —— 不再靠相似度猜“是不是同一个槽”</text>
</svg>
